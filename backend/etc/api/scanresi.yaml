openapi: 3.0.3
info:
  title: Scan Resi Wahana API
  description: REST API untuk platform pemindaian resi, manifest, dan tracking logistik Wahana Express.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Nginx Reverse Proxy / Gateway
  - url: http://localhost:5000/api
    description: Direct uWSGI Backend API Server

paths:
  /auth/login:
    post:
      summary: Login pengguna menggunakan username dan password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Kredensial tidak valid

  /auth/quick-login:
    post:
      summary: Quick login simulator untuk keperluan testing role demo
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  example: USR-ADMIN-001
      responses:
        '200':
          description: Quick login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  /auth/logout:
    post:
      summary: Logout dan hapus sesi token
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil

  /users:
    get:
      summary: Dapatkan daftar pengguna
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar pengguna berhasil diambil
    post:
      summary: Buat pengguna baru (Khusus Admin)
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - nama
                - role
                - password
              properties:
                username:
                  type: string
                nama:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, SUPERVISOR, PETUGAS, CUSTOMER]
                password:
                  type: string
      responses:
        '201':
          description: Pengguna berhasil dibuat

  /users/{id}/status:
    patch:
      summary: Ubah status aktif/non-aktif pengguna (Khusus Admin)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [AKTIF, NONAKTIF]
      responses:
        '200':
          description: Status pengguna berhasil diperbarui

  /tasks:
    get:
      summary: Dapatkan daftar tugas kurir / manifest
      tags:
        - Tasks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar tugas berhasil diambil
    post:
      summary: Buat penugasan baru (Khusus Admin)
      tags:
        - Tasks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - assigned_to
              properties:
                title:
                  type: string
                assigned_to:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Tugas berhasil dibuat

  /tasks/{id}/progress:
    patch:
      summary: Perbarui progres tugas
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progres berhasil diperbarui

  /tasks/{id}/complete:
    patch:
      summary: Selesaikan tugas
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tugas selesai

  /scans:
    get:
      summary: Dapatkan riwayat pemindaian barcode resi
      tags:
        - Scans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Riwayat scan berhasil diambil
    post:
      summary: Simpan event pemindaian resi baru
      tags:
        - Scans
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - barcode
                - scan_type
              properties:
                barcode:
                  type: string
                  example: WX-JKT-100293
                scan_type:
                  type: string
                  enum: [INBOUND, OUTBOUND, SORTING, DELIVERY]
                lokasi:
                  type: string
                catatan:
                  type: string
      responses:
        '200':
          description: Event scan berhasil dicatat

  /scans/stats/{user_id}:
    get:
      summary: Dapatkan statistik scan petugas tertentu
      tags:
        - Scans
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statistik berhasil diambil

  /paket/resi:
    post:
      summary: Buat draft paket baru dan generate nomor resi unik (Server-Side)
      tags:
        - Packages
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sender_name
                - recipient_name
                - destination
              properties:
                sender_name:
                  type: string
                sender_phone:
                  type: string
                recipient_name:
                  type: string
                recipient_phone:
                  type: string
                destination:
                  type: string
                weight_kg:
                  type: number
                  example: 1.5
                service_type:
                  type: string
                  example: REGULER
      responses:
        '201':
          description: Resi berhasil dibuat

  /paket:
    get:
      summary: Dapatkan daftar paket / kiriman
      tags:
        - Packages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar paket berhasil diambil

  /paket/{id}:
    get:
      summary: Dapatkan detail paket dan tracking history berdasarkan nomor resi
      tags:
        - Packages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail paket berhasil diambil
    patch:
      summary: Perbarui status paket
      tags:
        - Packages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status paket berhasil diperbarui

  /audit-logs:
    get:
      summary: Dapatkan catatan aktivitas audit log sistem (Khusus Admin)
      tags:
        - Audit
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit log berhasil diambil

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOi...
        user:
          type: object
          properties:
            id:
              type: string
              example: USR-ADMIN-001
            username:
              type: string
              example: admin
            nama:
              type: string
              example: Administrator
            role:
              type: string
              example: ADMIN
