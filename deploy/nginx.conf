# =====================================================================
# Dijak Express — Konfigurasi Nginx
#
# Arsitektur (PRD bagian 7):
#   Browser → Nginx ─┬─ /          → static PWA (dist/pwa)
#                    └─ /api/      → Perl Backend
#
# Varian A (default): proxy ke backend/server.pl (dev server, port 8080)
# Varian B (produksi CGI): fastcgi_pass → fcgiwrap menjalankan cgi-bin/api.cgi
#
# Jalankan cepat:
#   npm run build:pwa                     # hasil di dist/pwa (sw.js + manifest)
#   perl backend/server.pl                # terminal terpisah
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dijak-express
#   sudo ln -sf /etc/nginx/sites-available/dijak-express /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # hindari bentrok listen 80
#   sudo nginx -t && sudo systemctl reload nginx
#   # buka http://localhost
# =====================================================================

server {
    listen      80;
    server_name _;

    # ---------------------------------------------------------------
    # Static PWA (Quasar build output) — vueRouterMode 'hash'
    # sw.js & manifest.json WAJIB tidak di-cache agresif agar
    # pembaruan service worker terdeteksi browser.
    # ---------------------------------------------------------------
    root  /home/fadhil/Downloads/ScanResi_Magang/dist/pwa;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # ---------------------------------------------------------------
    # REST API — Varian A: reverse proxy ke dev server Perl
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------
    # REST API — Varian B: CGI murni via fcgiwrap (produksi klasik)
    # Install: sudo apt install fcgiwrap spawn-fcgi
    # ---------------------------------------------------------------
    # location ~ ^/cgi-bin/(.*)$ {
    #     root        /home/fadhil/Downloads/ScanResi_Magang/backend;
    #     fastcgi_pass unix:/run/fcgiwrap.socket;
    #     include     /etc/nginx/fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/cgi-bin/$1;
    #     fastcgi_param PATH_INFO     "";
    # }
}
