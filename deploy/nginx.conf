# =====================================================================
# Wahana Express — Konfigurasi Nginx
#
# Arsitektur (PRD bagian 7):
#   Browser → Nginx ─┬─ /          → static SPA (dist/spa)
#                    └─ /api/      → Perl Backend
#
# Varian A (default): proxy ke backend/server.pl (dev server, port 8080)
# Varian B (produksi CGI): fastcgi_pass → fcgiwrap menjalankan cgi-bin/api.cgi
#
# Jalankan cepat:
#   quasar build                          # hasil di dist/spa
#   perl backend/server.pl                # terminal terpisah
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wahana
#   sudo ln -s /etc/nginx/sites-available/wahana /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # buka http://localhost
# =====================================================================

server {
    listen      80;
    server_name _;

    # ---------------------------------------------------------------
    # Static SPA (Quasar build output) — vueRouterMode 'hash'
    # ---------------------------------------------------------------
    root  /home/fadhil/Downloads/ScanResi_Magang/dist/spa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # ---------------------------------------------------------------
    # REST API — Varian A: reverse proxy ke dev server Perl
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------
    # REST API — Varian B: CGI murni via fcgiwrap (produksi klasik)
    # Install: sudo apt install fcgiwrap spawn-fcgi
    # ---------------------------------------------------------------
    # location ~ ^/cgi-bin/(.*)$ {
    #     root        /home/fadhil/Downloads/ScanResi_Magang/backend;
    #     fastcgi_pass unix:/run/fcgiwrap.socket;
    #     include     /etc/nginx/fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/cgi-bin/$1;
    #     fastcgi_param PATH_INFO     "";
    # }
}
