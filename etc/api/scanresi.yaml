openapi: 3.0.3
info:
  title: Scan Resi Wahana API
  description: |
    REST API untuk platform pemindaian resi, manifest, dan tracking logistik Wahana Express.
    Didukung arsitektur **Pure Stored Procedures** MariaDB, **DCAF Query Object Pattern**, dan **sys_queries Registry**.
  version: 2.0.0
servers:
  - url: http://localhost:8080/api
    description: Nginx Reverse Proxy / Gateway (Akses Utama)
  - url: http://localhost:5000/api
    description: Direct Perl uWSGI Backend API Server

paths:
  /auth/login:
    post:
      operationId: AuthLogin
      x-dcaf-query: AuthLogin
      summary: Login pengguna menggunakan username dan password
      description: Memanggil Stored Procedure `sp_login` via query code `AuthLogin`.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Kredensial tidak valid

  /auth/quick-login:
    post:
      operationId: AuthQuickLogin
      x-dcaf-query: AuthLogin
      summary: Quick login simulator untuk keperluan testing role demo
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  example: USR-ADMIN-001
      responses:
        '200':
          description: Quick login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  /auth/logout:
    post:
      operationId: AuthLogout
      x-dcaf-query: AuthUpdateStatus
      summary: Logout dan perbarui status akun menjadi OFFLINE
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil

  /users:
    get:
      operationId: UsersListAll
      x-dcaf-query: UsersListAll
      summary: Dapatkan seluruh daftar pengguna (Admin & Dev)
      description: Memanggil Stored Procedure `sp_getusers` via query code `UsersListAll`.
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar pengguna berhasil diambil
    post:
      operationId: UsersInsert
      x-dcaf-query: UsersInsert
      summary: Buat pengguna baru (Khusus Admin)
      description: Memanggil Stored Procedure `sp_users_insert` via query code `UsersInsert`.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - username
                - password
                - role
              properties:
                name:
                  type: string
                  example: Petugas Gudang 1
                username:
                  type: string
                  example: petugas01
                password:
                  type: string
                  example: pass123
                role:
                  type: string
                  enum: [ADMIN, PETUGAS_SCAN, CUSTOMER, DEVELOPER]
                  example: PETUGAS_SCAN
      responses:
        '201':
          description: Pengguna berhasil dibuat

  /users/{id}:
    put:
      operationId: UsersUpdate
      x-dcaf-query: UsersUpdate
      summary: Perbarui data pengguna (Khusus Admin)
      description: Memanggil Stored Procedure `sp_users_update` via query code `UsersUpdate`.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, PETUGAS_SCAN, CUSTOMER, DEVELOPER]
      responses:
        '200':
          description: Pengguna berhasil diperbarui
    delete:
      operationId: UsersDelete
      x-dcaf-query: UsersDelete
      summary: Hapus pengguna (Khusus Admin)
      description: Memanggil Stored Procedure `sp_users_delete` via query code `UsersDelete`.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pengguna berhasil dihapus

  /users/{id}/status:
    patch:
      operationId: UsersToggleStatus
      x-dcaf-query: UsersToggleStatus
      summary: Toggle status aktif/nonaktif akun pengguna
      description: Memanggil Stored Procedure `sp_users_toggle_status` via query code `UsersToggleStatus`.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status pengguna berhasil diubah

  /tasks:
    get:
      operationId: TasksListAll
      x-dcaf-query: TasksListAll
      summary: Dapatkan daftar tugas pemindaian
      description: Memanggil Stored Procedure `sp_tasks_list` via query code `TasksListAll`.
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Daftar tugas berhasil diambil
    post:
      operationId: TasksInsert
      x-dcaf-query: TasksInsert
      summary: Buat penugasan baru (Khusus Admin)
      description: Memanggil Stored Procedure `sp_tasks_insert` via query code `TasksInsert`.
      tags:
        - Tasks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - target
              properties:
                user_id:
                  type: string
                  example: USR-SCAN-001
                shift:
                  type: string
                  example: Pagi
                tanggal:
                  type: string
                  format: date
                  example: 2026-09-01
                target:
                  type: integer
                  example: 100
                lokasi:
                  type: string
                  example: CIPUTAT
      responses:
        '201':
          description: Tugas berhasil dibuat

  /tasks/{id}/progress:
    patch:
      operationId: TasksProgress
      x-dcaf-query: TasksProgress
      summary: Tambahkan progres tugas (+1 scan berhasil)
      description: Memanggil Stored Procedure `sp_tasks_progress` via query code `TasksProgress`.
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progres tugas bertambah

  /tasks/{id}/complete:
    patch:
      operationId: TasksComplete
      x-dcaf-query: TasksComplete
      summary: Selesaikan tugas pemindaian (Kunci status)
      description: Memanggil Stored Procedure `sp_tasks_complete` via query code `TasksComplete`.
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tugas berhasil diselesaikan

  /scans:
    get:
      operationId: ScansListAll
      x-dcaf-query: ScansListAll
      summary: Dapatkan riwayat scan barcode
      description: Memanggil Stored Procedure `sp_scans_list` via query code `ScansListAll`.
      tags:
        - Scans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Riwayat scan berhasil diambil
    post:
      operationId: ScansProcess
      x-dcaf-query: ScansProcess
      summary: Transaksi pemindaian barcode resi (Atomik Stored Procedure)
      description: Memanggil Stored Procedure `sp_scans_process` via query code `ScansProcess` dengan row locking anti duplikasi.
      tags:
        - Scans
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nomor_resi
                - task_id
              properties:
                nomor_resi:
                  type: string
                  example: 93V5NQ9M
                task_id:
                  type: string
                  example: TASK-001
                lokasi:
                  type: string
                  example: CIPUTAT
                device_id:
                  type: string
                  example: SCAN-DEVICE-01
                jenis_scan:
                  type: string
                  example: INBOUND
      responses:
        '200':
          description: Pemindaian berhasil diproses

  /scans/stats/{user_id}:
    get:
      operationId: ScansStats
      x-dcaf-query: ScansStats
      summary: Dapatkan rekap statistik scan petugas
      description: Memanggil Stored Procedure `sp_scans_stats` via query code `ScansStats`.
      tags:
        - Scans
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statistik scan berhasil diambil

  /paket/resi:
    post:
      operationId: PaketCreateDraft
      x-dcaf-query: PaketCreateDraft
      summary: Generate nomor resi draft di sisi server
      description: Memanggil Stored Procedure `sp_paket_create_draft` via query code `PaketCreateDraft`.
      tags:
        - Packages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Nomor resi draft berhasil dibuat

  /paket:
    get:
      operationId: PaketListAll
      x-dcaf-query: PaketListAll
      summary: Dapatkan daftar paket / kiriman
      description: Memanggil Stored Procedure `sp_paket_list` via query code `PaketListAll`.
      tags:
        - Packages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar paket berhasil diambil

  /paket/{id}:
    get:
      operationId: PaketGetDetail
      x-dcaf-query: PaketGetDetail
      summary: Dapatkan detail paket dan tracking history berdasarkan nomor resi
      description: Memanggil Stored Procedure `sp_paket_get_detail` via query code `PaketGetDetail`.
      tags:
        - Packages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail paket berhasil diambil
    patch:
      operationId: CustInsert
      x-dcaf-query: CustInsert
      summary: Simpan data paket lengkap dari DRAFT menjadi TERDAFTAR
      description: Memanggil Stored Procedure `sp_paket_save` via query code `CustInsert`.
      tags:
        - Packages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama_barang
                - pengirim
                - alamat_pengirim
                - telepon_pengirim
                - penerima
                - alamat_tujuan
                - telepon_penerima
              properties:
                nama_barang:
                  type: string
                  example: Sparepart Mesin
                pengirim:
                  type: string
                  example: Budi Santoso
                alamat_pengirim:
                  type: string
                  example: Jl. Raya Bogor No. 12
                telepon_pengirim:
                  type: string
                  example: "08123456789"
                penerima:
                  type: string
                  example: Toko Maju Jaya
                alamat_tujuan:
                  type: string
                  example: Jl. Merdeka No. 45, Bandung
                telepon_penerima:
                  type: string
                  example: "08987654321"
                berat_kg:
                  type: number
                  example: 2.5
                jenis_layanan:
                  type: string
                  enum: [REGULER, EXPRESS, SAME_DAY]
                  example: REGULER
      responses:
        '200':
          description: Data paket berhasil disimpan

  /audit-logs:
    get:
      operationId: AuditListAll
      x-dcaf-query: AuditListAll
      summary: Dapatkan catatan aktivitas audit log sistem (Khusus Admin)
      description: Memanggil Stored Procedure `sp_audit_list` via query code `AuditListAll`.
      tags:
        - Audit
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit log berhasil diambil

  /dev/procedures:
    get:
      operationId: DevProceduresStatus
      x-dcaf-query: DevListQueries
      summary: Dapatkan status mesin Stored Procedures & koneksi DB (Khusus Developer / Admin)
      tags:
        - Developer & System
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Status Stored Procedures & DB info

  /dev/queries:
    get:
      operationId: DevListQueries
      x-dcaf-query: DevListQueries
      summary: Ambil seluruh daftar katalog query dari tabel sys_queries (Khusus Developer / Admin)
      description: Memanggil Stored Procedure `sp_sys_get_queries` via query code `DevListQueries`.
      tags:
        - Developer & System
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar registry query berhasil diambil
    post:
      operationId: DevCreateQuery
      x-dcaf-query: DevListQueries
      summary: Daftarkan query baru ke dalam sys_queries
      description: Memanggil Stored Procedure `sp_sys_upsert_query`.
      tags:
        - Developer & System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysQueryItem'
      responses:
        '201':
          description: Query berhasil didaftarkan

  /dev/queries/{id}:
    put:
      operationId: DevUpdateQuery
      x-dcaf-query: DevListQueries
      summary: Perbarui konfigurasi query pada sys_queries
      description: Memanggil Stored Procedure `sp_sys_upsert_query`.
      tags:
        - Developer & System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysQueryItem'
      responses:
        '200':
          description: Query berhasil diperbarui
    delete:
      operationId: DevDeleteQuery
      x-dcaf-query: DevListQueries
      summary: Hapus query dari sys_queries
      description: Memanggil Stored Procedure `sp_sys_delete_query`.
      tags:
        - Developer & System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query berhasil dihapus

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOi...
        user:
          type: object
          properties:
            id:
              type: string
              example: USR-ADMIN-001
            username:
              type: string
              example: admin
            name:
              type: string
              example: Administrator
            role:
              type: string
              enum: [ADMIN, PETUGAS_SCAN, CUSTOMER, DEVELOPER]
              example: ADMIN
    SysQueryItem:
      type: object
      required:
        - query_id
        - query_code
        - sp_name
      properties:
        query_id:
          type: string
          example: QRY-024
        query_code:
          type: string
          example: CustomReport
        sp_name:
          type: string
          example: sp_custom_report
        param_keys:
          type: array
          items:
            type: string
          example: ["start_date", "end_date"]
        query_type:
          type: string
          enum: [SELECT_ROW, SELECT_ALL, EXECUTE]
          example: SELECT_ALL
        required_role:
          type: string
          enum: [PUBLIC, PETUGAS_SCAN, ADMIN, DEVELOPER]
          example: ADMIN
        cache_ttl:
          type: integer
          example: 60
        timeout_sec:
          type: integer
          example: 5
        deskripsi:
          type: string
          example: Ambil data rekapitulasi kustom
